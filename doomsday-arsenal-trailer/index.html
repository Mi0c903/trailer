<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doomsday Arsenal Trailer</title>
<link rel="stylesheet" href="src/fonts.css">
<style>
  :root { --bg: #02040a; --fg: #eaf6ff; --dim: #7f94a8; --accent: #4ff3ff; --hot: #ff7a1a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Chakra Petch", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  .stage { position: relative; width: min(100%, calc((100vh - 120px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; box-shadow: 0 0 80px rgba(79, 243, 255, .08); }
  canvas { width: 100%; height: 100%; display: block; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(2, 4, 10, .82); cursor: pointer; }
  .overlay h1 { font-family: Orbitron, sans-serif; font-weight: 900; letter-spacing: .12em; margin: 0; font-size: clamp(22px, 4vw, 56px); text-align: center; }
  .overlay h1 span { color: var(--hot); }
  .overlay p { margin: 0; color: var(--dim); font-family: "Share Tech Mono", monospace; letter-spacing: .15em; font-size: clamp(11px, 1.2vw, 15px); }
  .play { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; box-shadow: 0 0 30px rgba(79, 243, 255, .35); }
  .play::after { content: ""; border-left: 26px solid var(--accent); border-top: 16px solid transparent; border-bottom: 16px solid transparent; margin-left: 8px; }
  .overlay.hidden { display: none; }
  .bar { width: min(100%, calc((100vh - 120px) * 16 / 9)); display: flex; align-items: center; gap: 12px; font-family: "Share Tech Mono", monospace; font-size: 14px; color: var(--dim); flex-wrap: wrap; }
  .bar button, .bar label { background: transparent; color: var(--fg); border: 1px solid #23465a; padding: 6px 12px; font: inherit; cursor: pointer; border-radius: 3px; }
  .bar button:hover, .bar label:hover { border-color: var(--accent); }
  .bar input[type=file] { display: none; }
  .scrub { position: relative; flex: 1 1 240px; height: 26px; cursor: pointer; }
  .scrub .track { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: #13263a; }
  .scrub .fill { position: absolute; left: 0; top: 11px; height: 4px; background: var(--accent); }
  .scrub .mark { position: absolute; top: 6px; width: 1px; height: 14px; background: #2f5b74; }
  .time { min-width: 110px; text-align: right; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="c"></canvas>
  <div class="overlay" id="overlay">
    <h1>DOOMSDAY <span>ARSENAL</span></h1>
    <div class="play"></div>
    <p id="status">PREPARING SOUNDTRACK…</p>
  </div>
</div>
<div class="bar">
  <button id="pp">PLAY</button>
  <div class="scrub" id="scrub"><div class="track"></div><div class="fill" id="fill"></div></div>
  <span class="time" id="time">0:00 / 0:00</span>
  <label title="Preview your own gameplay clip in the footage slot">LOAD GAMEPLAY<input type="file" id="clip" accept="video/*"></label>
  <button id="fs">FULLSCREEN</button>
</div>
<script type="module">
  import { Trailer } from './src/trailer.js';
  import { renderSoundtrack } from './src/music.js';
  import { VideoSource } from './src/gameplay-source.js';
  import { gameplayWindow } from './src/timeline.js';

  const $ = (id) => document.getElementById(id);
  const tr = new Trailer($('c'));
  await Trailer.fonts();
  await tr.loadImages();
  tr.prepare();
  const win = gameplayWindow(tr.tl);
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

  // scene markers
  for (const s of tr.tl.segs) {
    if (s.id === 'body' && s.index > 0) continue;
    const m = document.createElement('div');
    m.className = 'mark';
    m.style.left = `${(s.start / tr.duration) * 100}%`;
    m.title = s.id;
    $('scrub').appendChild(m);
  }

  let audioCtx, buffer, source, playing = false, offset = 0, startedAt = 0;
  const now = () => (playing ? audioCtx.currentTime - startedAt : offset);

  tr.render(0);
  async function loadSoundtrack() {
    // assets/soundtrack.mp3 is written by `npm run render`; use it if it matches this cut.
    try {
      const r = await fetch('assets/soundtrack.mp3');
      if (r.ok) {
        const buf = await new OfflineAudioContext(2, 1, 44100).decodeAudioData(await r.arrayBuffer());
        if (Math.abs(buf.duration - tr.duration) < 0.6) return buf;
      }
    } catch {}
    return renderSoundtrack(tr, (p) => ($('status').textContent = `GENERATING SOUNDTRACK… ${Math.round(p * 100)}%`));
  }
  try {
    buffer = await loadSoundtrack();
    $('status').textContent = 'CLICK TO PLAY  //  SPACE  ←  →  F';
  } catch (e) {
    console.error(e);
    $('status').textContent = 'CLICK TO PLAY (NO AUDIO)';
  }

  function play() {
    audioCtx ??= new AudioContext();
    if (offset >= tr.duration - 0.05) offset = 0;
    if (buffer) {
      source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0, offset);
    }
    startedAt = audioCtx.currentTime - offset;
    playing = true;
    $('overlay').classList.add('hidden');
    $('pp').textContent = 'PAUSE';
  }
  function pause() {
    if (!playing) return;
    offset = now();
    source?.stop();
    playing = false;
    $('pp').textContent = 'PLAY';
  }
  function seek(t) {
    const was = playing;
    pause();
    offset = Math.max(0, Math.min(tr.duration, t));
    if (was) play();
  }

  $('overlay').onclick = play;
  $('pp').onclick = () => (playing ? pause() : play());
  $('fs').onclick = () => document.querySelector('.stage').requestFullscreen?.();
  $('scrub').onclick = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    seek(((e.clientX - r.left) / r.width) * tr.duration);
  };
  $('clip').onchange = (e) => {
    const f = e.target.files[0];
    // a hand-picked file plays from its start, without the configured cuts
    if (f) tr.gameplay = new VideoSource(URL.createObjectURL(f), [[0, win.end - win.start]]);
  };
  // Load the configured clip if it exists.
  const clip = tr.cfg.gameplay.file;
  fetch(clip, { method: 'HEAD' }).then((r) => { if (r.ok && !tr.gameplay) tr.gameplay = new VideoSource(clip, tr.cfg.gameplay.cuts); }).catch(() => {});

  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'ArrowRight') seek(now() + 5);
    if (e.code === 'ArrowLeft') seek(now() - 5);
    if (e.code === 'KeyF') $('fs').click();
  });

  function frame() {
    let t = now();
    if (playing && t >= tr.duration) { pause(); offset = tr.duration; t = tr.duration; }
    if (tr.gameplay?.sync) {
      const lt = t - win.start;
      if (lt >= 0 && lt < win.end - win.start) tr.gameplay.sync(lt, playing);
      else tr.gameplay.stop();
    }
    tr.render(t);
    $('fill').style.width = `${(t / tr.duration) * 100}%`;
    $('time').textContent = `${fmt(t)} / ${fmt(tr.duration)}`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
