name: Render Doomsday Arsenal trailer

# Renders doomsday-arsenal-trailer/out/doomsday-arsenal-trailer.mp4 and attaches it
# to the run as a downloadable artifact.
on:
  workflow_dispatch:
    inputs:
      preview:
        description: Quick 720p preview instead of the full 1080p render
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['doomsday-arsenal-trailer/**', '.github/workflows/render.yml']

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: doomsday-arsenal-trailer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doomsday-arsenal-trailer/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render
        run: npm run render -- ${{ inputs.preview && '--preview' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: doomsday-arsenal-trailer
          path: doomsday-arsenal-trailer/out/*.mp4
          retention-days: 30
